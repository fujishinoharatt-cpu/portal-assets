<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ポータル</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ポータル">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex, nofollow">
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .fallback { position: fixed; right: 8px; bottom: 8px; z-index: 1; font: 12px sans-serif; }
    .fallback a { color: #94a3b8; }
  </style>
</head>
<body>
  <!-- このファイルは公開されるため、GAS の URL は書かない。URL はホーム画面に追加するリンク（?p=<URL>）で渡し、ブラウザに記憶する -->
  <iframe id="portal" allow="clipboard-write" title="ポータル" hidden></iframe>
  <div class="fallback"><a id="direct" href="#" hidden>開けない場合はこちら</a></div>
  <p id="wait" hidden style="color:#94a3b8;font:16px sans-serif;text-align:center;margin-top:40vh">⌛ アプリを開いています…</p>
  <p id="msg" hidden style="color:#94a3b8;font:14px sans-serif;text-align:center;margin-top:40vh">管理者から受け取った専用リンクから開いてください</p>
  <script>
    /* #u=<GAS の URL> … そのアプリを表示（記憶しない）。#p=<GAS の URL> … ポータルとして表示し、このブラウザに記憶。
       どちらも無ければ、記憶したポータルを表示。script.google.com の https のみ許可 */
    (function () {
      var KEY = 'portal_exec_url';
      /* #wait: ポータルのボタンから開いた直後の待機画面。通行証が届くと、ポータルがこのタブを #u=... に切り替える（切り替わったら読み直す） */
      window.addEventListener('hashchange', function () { location.reload(); });
      if (location.hash === '#wait') { document.getElementById('wait').hidden = false; return; }

      function ok(s) {
        try { var p = new URL(s); return p.protocol === 'https:' && p.hostname === 'script.google.com' ? p.href : ''; } catch (e) { return ''; }
      }
      /* # 以降はブラウザの外（GitHub のサーバー）に送られないので、URL は #u= / #p= で渡す。互換のため ?u= / ?p= も読む */
      var h = new URLSearchParams(location.hash.replace(/^#/, ''));
      var q = new URLSearchParams(location.search);
      function param(k) { return h.get(k) || q.get(k); }
      var target = ok(param('u'));
      if (target) {
        document.title = 'アプリ';
      } else {
        target = ok(param('p'));
        try {
          if (target) { localStorage.setItem(KEY, target); history.replaceState(null, '', location.pathname); }
          else target = ok(localStorage.getItem(KEY));
        } catch (e) {}
      }
      var frame = document.getElementById('portal');
      if (target) {
        frame.src = target; frame.hidden = false;
        var a = document.getElementById('direct'); a.href = target; a.hidden = false;
      } else {
        document.getElementById('msg').hidden = false;
      }
    })();
  </script>
</body>
</html>
